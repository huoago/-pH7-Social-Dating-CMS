global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 10s
    timeout client 60s
    timeout server 60s

frontend mysql_plain
    bind *:3306
    default_backend tidb_tls

backend tidb_tls
    server tidb ${TIDB_HOST}:4000 ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt sni str(${TIDB_HOST}) verifyhost ${TIDB_HOST} check inter 10s fall 3 rise 2
