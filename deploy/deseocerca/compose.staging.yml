x-deseocerca-build: &deseocerca-build
  context: ../..
  dockerfile: deploy/deseocerca/Dockerfile.staging
  args:
    PHP_VERSION: "8.2"

x-deseocerca-environment: &deseocerca-environment
  TZ: America/Lima
  PH7_MAILER_DSN: ${PH7_MAILER_DSN:-}

x-deseocerca-volumes: &deseocerca-volumes
  - deseocerca_configs:/var/www/html/_protected/app/configs
  - deseocerca_public_data:/var/www/html/data
  - deseocerca_protected_data:/var/www/html/_protected/data
  - deseocerca_modules:/var/www/html/_repository/module
  - deseocerca_runtime:/var/lib/deseocerca/runtime

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-deseocerca}
      MYSQL_USER: ${MYSQL_USER:-deseocerca}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: America/Lima
    volumes:
      - deseocerca_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - deseocerca_private

  app:
    image: deseocerca-app:staging
    build: *deseocerca-build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *deseocerca-environment
    volumes: *deseocerca-volumes
    networks:
      - deseocerca_private
      - deseocerca_edge

  lifecycle:
    image: deseocerca-app:staging
    build: *deseocerca-build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *deseocerca-environment
    volumes: *deseocerca-volumes
    command:
      - sh
      - -lc
      - |
        while [ ! -s /var/www/html/_constants.php ]; do sleep 60; done
        while true; do
          php deploy/deseocerca/account-lifecycle.php || true
          sleep 86400
        done
    networks:
      - deseocerca_private
      - deseocerca_edge

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      STAGING_SITE_ADDRESS: ${STAGING_SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - deseocerca_caddy_data:/data
      - deseocerca_caddy_config:/config
    networks:
      - deseocerca_edge

networks:
  deseocerca_private:
    internal: true
  deseocerca_edge:

volumes:
  deseocerca_mysql:
  deseocerca_configs:
  deseocerca_public_data:
  deseocerca_protected_data:
  deseocerca_modules:
  deseocerca_runtime:
  deseocerca_caddy_data:
  deseocerca_caddy_config:
