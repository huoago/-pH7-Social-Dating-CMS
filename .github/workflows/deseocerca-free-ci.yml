name: Validate DeseoCerca Free Tier

on:
  push:
    branches:
      - 18.x
  pull_request:
    branches:
      - 18.x

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  free-tier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate free-tier deployment script syntax
        run: |
          bash -n deploy/deseocerca/google-free-vm-bootstrap.sh
          bash -n deploy/deseocerca/prepare-first-install-free.sh
          bash -n deploy/deseocerca/apply-bootstrap-free.sh
          bash -n deploy/deseocerca/backup-free.sh
          bash -n deploy/deseocerca/restore-free.sh

      - name: Validate TiDB-compatible SQL baseline
        shell: bash
        run: |
          set -euo pipefail
          sql='_install/data/sql/MySQL/pH7_Core.sql'

          # TiDB Cloud Starter supports FULLTEXT only in selected AWS regions.
          # DeseoCerca deliberately relies on exactly the existing error-log
          # FULLTEXT index and the deployment workflow restricts TiDB to one of
          # those supported regions. Other known unsupported MySQL constructs
          # remain release blockers.
          if grep -Eiq '\bCREATE[[:space:]]+(TRIGGER|PROCEDURE|FUNCTION|EVENT)\b|\bSPATIAL\b' "$sql"; then
            echo "The pH7 schema contains a TiDB-incompatible trigger/procedure/function/event/spatial feature."
            exit 1
          fi

          expected_fulltext='^[[:space:]]*FULLTEXT[[:space:]]+KEY[[:space:]]+logError[[:space:]]*\(logError\)[[:space:]]*$'
          fulltext_total="$(grep -Eic '^[[:space:]]*FULLTEXT[[:space:]]+(KEY|INDEX)\b' "$sql" || true)"
          if [ "$fulltext_total" -ne 1 ] || ! grep -Eq "$expected_fulltext" "$sql"; then
            echo "Unexpected FULLTEXT schema change. Free Tier deployment only permits the existing ph7_log_error.logError index."
            exit 1
          fi

      - name: Validate TiDB TLS proxy configuration
        run: |
          docker run --rm \
            -e TIDB_HOST=gateway01.us-west-2.prod.aws.tidbcloud.com \
            -v "$PWD/deploy/deseocerca/haproxy-tidb.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" \
            haproxy:3.2-alpine \
            haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg

      - name: Validate free-tier Compose configuration
        env:
          DESEOCERCA_APP_IMAGE: deseocerca-free:ci
          STAGING_SITE_ADDRESS: :80
          TIDB_HOST: gateway01.us-west-2.prod.aws.tidbcloud.com
          TIDB_USERNAME: ci.root
          TIDB_PASSWORD: ci-not-a-real-password
          TIDB_DATABASE: deseocerca
        run: docker compose -f deploy/deseocerca/compose.free.yml config --quiet

      - name: Verify MySQL client tooling used by backup and restore
        run: |
          docker run --rm mysql:8.0 mysqldump --version
          docker run --rm mysql:8.0 mysql --version
