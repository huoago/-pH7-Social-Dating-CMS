name: DeseoCerca Web Release Gate

on:
  pull_request:
    branches: [18.x]
    paths:
      - 'site/**'
      - '.github/workflows/deseocerca-pages.yml'
  push:
    branches: [18.x]
    paths:
      - 'site/**'
      - '.github/workflows/deseocerca-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deseocerca-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate JavaScript syntax
        run: node --check site/app.js
      - name: Validate production static assets
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
          test -s site/404.html
          grep -Fq 'DeseoCerca' site/index.html
          grep -Fq 'Solo mayores de 18 años' site/app.js
          grep -Fq '/terminos' site/app.js
          grep -Fq '/privacidad' site/app.js
          grep -Fq '/seguridad' site/app.js
          grep -Fq '/normas-comunidad' site/app.js
          grep -Fq '/cookies' site/app.js
          grep -Fq '/contacto' site/app.js
          ! grep -Eiq 'service[_-]?role|sb_secret_' site/index.html site/app.js site/styles.css
      - name: Verify immutable CDN assets
        shell: bash
        run: |
          set -euo pipefail
          COMMIT='5d64a034f60c65c1e184113861501aaebaf320f1'
          curl --fail --silent --show-error --location \
            "https://cdn.jsdelivr.net/gh/huoago/-pH7-Social-Dating-CMS@${COMMIT}/site/app.js" \
            --output /tmp/app.js
          curl --fail --silent --show-error --location \
            "https://cdn.jsdelivr.net/gh/huoago/-pH7-Social-Dating-CMS@${COMMIT}/site/styles.css" \
            --output /tmp/styles.css
          node --check /tmp/app.js
          test -s /tmp/styles.css
      - name: Verify live Supabase public endpoint
        shell: bash
        env:
          SUPABASE_URL: https://ostmkogqfyepxakqfgnd.supabase.co
          SUPABASE_KEY: sb_publishable_1a0ntgqpl79ygaKe7xixmw_a_DCGMQT
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/interests.json --write-out '%{http_code}' \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/interests?select=id,name_es&limit=1")"
          test "$code" = "200"
          python3 - <<'PY'
          import json
          rows=json.load(open('/tmp/interests.json'))
          assert isinstance(rows,list)
          PY
