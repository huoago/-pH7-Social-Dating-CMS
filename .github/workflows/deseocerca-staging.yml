name: DeseoCerca Staging Deploy

on:
  workflow_dispatch:
    inputs:
      prepare_host:
        description: Initialize a fresh Ubuntu VM before deploying (first run only)
        required: true
        default: false
        type: boolean
      apply_bootstrap:
        description: Apply the guarded DeseoCerca post-install bootstrap before runtime verification
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deseocerca-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STAGING_HOST: ${{ secrets.DESEOCERCA_STAGING_HOST }}
      STAGING_USER: ${{ secrets.DESEOCERCA_STAGING_USER }}
      STAGING_PORT: ${{ secrets.DESEOCERCA_STAGING_PORT }}
      STAGING_SSH_KEY: ${{ secrets.DESEOCERCA_STAGING_SSH_KEY }}
      STAGING_KNOWN_HOSTS: ${{ secrets.DESEOCERCA_STAGING_KNOWN_HOSTS }}
      STAGING_SITE_ADDRESS: ${{ secrets.DESEOCERCA_STAGING_SITE_ADDRESS }}
      MAILER_DSN: ${{ secrets.DESEOCERCA_STAGING_MAILER_DSN }}
      REMOTE_DIR: /opt/deseocerca-staging
      SOURCE_REF: ${{ github.ref_name }}

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v7

      - name: Validate required staging secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(STAGING_HOST STAGING_USER STAGING_SSH_KEY)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret for ${name}."
              exit 1
            fi
          done
          case "$SOURCE_REF" in
            deseocerca-v1|18.x) ;;
            *)
              echo "Staging deployment is restricted to deseocerca-v1 or 18.x; got '$SOURCE_REF'."
              exit 1
              ;;
          esac
          if [[ ! "$STAGING_USER" =~ ^[a-z_][a-z0-9_-]*\$?$ ]]; then
            echo "STAGING_USER contains unsupported characters."
            exit 1
          fi
          port="${STAGING_PORT:-22}"
          if [[ ! "$port" =~ ^[0-9]+$ ]] || [ "$port" -lt 1 ] || [ "$port" -gt 65535 ]; then
            echo "STAGING_PORT must be a valid TCP port."
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          port="${STAGING_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/deseocerca_staging
          chmod 600 ~/.ssh/deseocerca_staging
          if [ -n "${STAGING_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$STAGING_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "DESEOCERCA_STAGING_KNOWN_HOSTS is not configured; using ssh-keyscan for this staging host."
            for attempt in {1..10}; do
              if ssh-keyscan -T 5 -p "$port" -H "$STAGING_HOST" > ~/.ssh/known_hosts 2>/dev/null; then
                break
              fi
              if [ "$attempt" -eq 10 ]; then
                echo "Unable to read the staging SSH host key."
                exit 1
              fi
              sleep 6
            done
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare fresh Ubuntu host
        if: ${{ inputs.prepare_host }}
        shell: bash
        run: |
          set -euo pipefail
          port="${STAGING_PORT:-22}"
          ssh -i ~/.ssh/deseocerca_staging -p "$port" "$STAGING_USER@$STAGING_HOST" \
            "sudo -n DESEOCERCA_DEPLOY_USER='$STAGING_USER' STAGING_SITE_ADDRESS=':80' bash -s" \
            < deploy/deseocerca/free-vm-bootstrap.sh

      - name: Validate remote staging state
        shell: bash
        run: |
          set -euo pipefail
          port="${STAGING_PORT:-22}"
          ssh -i ~/.ssh/deseocerca_staging -p "$port" "$STAGING_USER@$STAGING_HOST" \
            "set -e; \
             test -d '$REMOTE_DIR/.git' || { echo 'Missing staging repository. Re-run with prepare_host=true.'; exit 1; }; \
             test -f '$REMOTE_DIR/.env' || { echo 'Missing staging .env. Re-run with prepare_host=true.'; exit 1; }; \
             test -w '$REMOTE_DIR' || { echo 'Staging directory is not writable by the SSH deployment user.'; exit 1; }"

      - name: Sync selected release branch to staging VM
        shell: bash
        run: |
          set -euo pipefail
          port="${STAGING_PORT:-22}"
          ssh -i ~/.ssh/deseocerca_staging -p "$port" "$STAGING_USER@$STAGING_HOST" \
            "set -e; \
             cd '$REMOTE_DIR'; \
             git fetch --prune origin '+refs/heads/$SOURCE_REF:refs/remotes/origin/$SOURCE_REF'; \
             git checkout -B '$SOURCE_REF' 'origin/$SOURCE_REF'; \
             git reset --hard 'origin/$SOURCE_REF'; \
             test \"\$(git rev-parse HEAD)\" = '$GITHUB_SHA'"

      - name: Update non-database staging environment
        shell: bash
        run: |
          set -euo pipefail
          port="${STAGING_PORT:-22}"
          python3 - <<'PY' > /tmp/deseocerca-env-overlay.json
          import json
          import os

          payload = {
              "STAGING_SITE_ADDRESS": os.environ.get("STAGING_SITE_ADDRESS") or ":80",
          }
          mailer_dsn = os.environ.get("MAILER_DSN") or ""
          if mailer_dsn:
              payload["PH7_MAILER_DSN"] = mailer_dsn
          print(json.dumps(payload))
          PY
          ssh -i ~/.ssh/deseocerca_staging -p "$port" "$STAGING_USER@$STAGING_HOST" \
            "python3 '$REMOTE_DIR/deploy/deseocerca/update-env.py' '$REMOTE_DIR/.env'" \
            < /tmp/deseocerca-env-overlay.json
          rm -f /tmp/deseocerca-env-overlay.json

      - name: Build and start staging stack
        shell: bash
        run: |
          set -euo pipefail
          port="${STAGING_PORT:-22}"
          ssh -i ~/.ssh/deseocerca_staging -p "$port" "$STAGING_USER@$STAGING_HOST" \
            "set -e; \
             if docker info >/dev/null 2>&1; then dc='docker'; \
             elif sudo -n docker info >/dev/null 2>&1; then dc='sudo -n docker'; \
             else echo 'Docker is unavailable to the staging deployment user.'; exit 1; fi; \
             \$dc compose version >/dev/null; \
             cd '$REMOTE_DIR'; \
             \$dc compose --env-file .env -f deploy/deseocerca/compose.staging.yml up -d --build --remove-orphans; \
             \$dc compose --env-file .env -f deploy/deseocerca/compose.staging.yml ps"

      - name: Apply DeseoCerca post-install bootstrap
        if: ${{ inputs.apply_bootstrap }}
        shell: bash
        run: |
          set -euo pipefail
          port="${STAGING_PORT:-22}"
          ssh -i ~/.ssh/deseocerca_staging -p "$port" "$STAGING_USER@$STAGING_HOST" \
            "set -e; cd '$REMOTE_DIR'; bash deploy/deseocerca/apply-bootstrap.sh"

      - name: Run host preflight
        shell: bash
        run: |
          set -euo pipefail
          port="${STAGING_PORT:-22}"
          expected_host=""
          site_address="${STAGING_SITE_ADDRESS:-:80}"
          if [[ "$site_address" != :* ]]; then
            expected_host="$site_address"
          fi
          ssh -i ~/.ssh/deseocerca_staging -p "$port" "$STAGING_USER@$STAGING_HOST" \
            "set -e; \
             if sudo -n true >/dev/null 2>&1; then \
               sudo -n DESEOCERCA_DIR='$REMOTE_DIR' bash '$REMOTE_DIR/deploy/deseocerca/host-preflight.sh' '$expected_host'; \
             else \
               DESEOCERCA_DIR='$REMOTE_DIR' bash '$REMOTE_DIR/deploy/deseocerca/host-preflight.sh' '$expected_host'; \
             fi"

      - name: Staging runtime smoke check
        shell: bash
        run: |
          set -euo pipefail
          port="${STAGING_PORT:-22}"
          ssh -i ~/.ssh/deseocerca_staging -p "$port" "$STAGING_USER@$STAGING_HOST" \
            "set -e; \
             if docker info >/dev/null 2>&1; then dc='docker'; \
             else dc='sudo -n docker'; fi; \
             cd '$REMOTE_DIR'; \
             compose=\"\$dc compose --env-file .env -f deploy/deseocerca/compose.staging.yml\"; \
             \$compose exec -T app php -v >/dev/null; \
             \$compose exec -T caddy wget -qO- http://app/ >/dev/null; \
             if \$compose exec -T app test -s /var/www/html/_constants.php; then \
               \$compose exec -T app test ! -d /var/www/html/_install; \
               \$compose ps --status running --services | grep -qx lifecycle; \
               \$compose exec -T app php deploy/deseocerca/verify-runtime.php; \
               echo 'DeseoCerca staging installed runtime is healthy.'; \
             else \
               \$compose exec -T app test -d /var/www/html/_install; \
               echo 'DeseoCerca staging is responding and waiting for the first browser installation.'; \
             fi"

      - name: Remove temporary SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/deseocerca_staging
