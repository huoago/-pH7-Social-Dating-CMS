name: Validate Docker

on:
  push:
    branches:
      - 18.x
  pull_request:
    branches:
      - 18.x

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate development Compose configuration
        run: docker compose config --quiet

      - name: Build development image
        run: docker compose build

      - name: Validate DeseoCerca maintenance and deployment syntax
        run: |
          bash -n deploy/deseocerca/free-vm-bootstrap.sh
          bash -n deploy/deseocerca/apply-bootstrap.sh
          bash -n deploy/deseocerca/backup.sh
          systemd-analyze calendar '*-*-* 03:20:00 America/Lima' >/dev/null
          docker compose run --rm --no-deps php sh -lc \
            "php -l deploy/deseocerca/cli-bootstrap.php && php -l deploy/deseocerca/account-lifecycle.php && php -l deploy/deseocerca/verify-runtime.php && php -l _protected/app/system/modules/user/models/AccountLifecycleModel.php"

      - name: Validate staging Compose configuration
        env:
          MYSQL_PASSWORD: ci-deseocerca-password
          MYSQL_ROOT_PASSWORD: ci-deseocerca-root-password
          STAGING_SITE_ADDRESS: :80
        run: docker compose -f deploy/deseocerca/compose.staging.yml config --quiet

      - name: Build staging image
        run: docker build --file deploy/deseocerca/Dockerfile.staging --tag deseocerca-staging-ci .

      - name: Validate staging locale, entrypoint, and runtime persistence
        run: |
          docker run --rm --entrypoint sh deseocerca-staging-ci -lc \
            "sh -n /usr/local/bin/deseocerca-entrypoint && php -l deploy/deseocerca/account-lifecycle.php && php -l deploy/deseocerca/verify-runtime.php && test -s _protected/app/langs/es_ES/LC_MESSAGES/global.mo && grep -q 'timezone = \"America/Lima\"' _protected/app/langs/es_ES/config/config.ini"
          docker volume create deseocerca-ci-runtime >/dev/null
          docker run --rm \
            -v deseocerca-ci-runtime:/var/lib/deseocerca/runtime \
            deseocerca-staging-ci \
            sh -lc "test -d /var/www/html/_install; printf '%s\n' '<?php define(\"DESEOCERCA_CI\", true);' > /var/www/html/_constants.php; sleep 6; test ! -d /var/www/html/_install"
          docker run --rm \
            -v deseocerca-ci-runtime:/var/lib/deseocerca/runtime \
            deseocerca-staging-ci \
            sh -lc "grep -q DESEOCERCA_CI /var/www/html/_constants.php && test ! -d /var/www/html/_install"
          docker volume rm deseocerca-ci-runtime >/dev/null

      - name: Start development stack
        run: docker compose up --detach --wait

      - name: Verify installer responds
        run: |
          for _ in {1..30}; do
            if curl --fail --location --silent --show-error http://localhost:8080/ > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Stop development stack
        if: always()
        run: |
          docker compose down --volumes
          docker volume rm deseocerca-ci-runtime >/dev/null 2>&1 || true
